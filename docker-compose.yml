version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: axel-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axelpass}
      POSTGRES_DB: ${POSTGRES_DB:-axel}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    # Tuned for a write-heavy single-node paper soak. The defaults in the image
    # (~128 MB shared_buffers) are far too small once the runtime writes
    # hundreds of thousands of bars per day.
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=2GB
      - -c
      - wal_compression=on
      - -c
      - synchronous_commit=off
      - -c
      - track_io_timing=on
      - -c
      - max_connections=100
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-axel} -d ${POSTGRES_DB:-axel}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: axel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  paper-soak:
    build: .
    restart: unless-stopped
    profiles: ["paper"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://axel:${POSTGRES_PASSWORD:-axelpass}@timescaledb:5432/${POSTGRES_DB:-axel}
      ENVIRONMENT: paper
      ALPACA_PAPER: "true"
      LIVE_TRADING_CONFIRMED: "false"
      KILLSWITCH_STATE_FILE: /app/state/.axel_killswitch.json
      HALT_STATE_FILE: /app/state/.axel_halt.json
      LOG_FILE: /var/log/axel/axel.log
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-10000000}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-5}
    volumes:
      - axel_state:/app/state
      - axel_logs:/var/log/axel
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/axel-paper-soak-heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3

  # One-shot schema creation. The repository has no Alembic revisions yet, so
  # first boot uses SQLAlchemy metadata. Replace this with `alembic upgrade head`
  # once the initial revision is generated.
  migrate:
    build: .
    container_name: axel-migrate
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://axel:${POSTGRES_PASSWORD:-axelpass}@timescaledb:5432/${POSTGRES_DB:-axel}
      ENVIRONMENT: paper
      ALPACA_PAPER: "true"
      LIVE_TRADING_CONFIRMED: "false"
    command: ["python", "-c", "from axel.db.session import init_db; init_db()"]
    depends_on:
      timescaledb:
        condition: service_healthy

  # Read-only dashboard API + SSE. Serves the unchanged terminal UI at /.
  api:
    build: .
    container_name: axel-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://axel:${POSTGRES_PASSWORD:-axelpass}@timescaledb:5432/${POSTGRES_DB:-axel}
      ENVIRONMENT: paper
      ALPACA_PAPER: "true"
      LIVE_TRADING_CONFIRMED: "false"
      DASHBOARD_CORS_ORIGINS: ${DASHBOARD_CORS_ORIGINS:-*}
      LOG_FILE: ""
    command: ["python", "scripts/run_dashboard_api.py", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${AXEL_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Deterministic paper workers. They share the database and never call an LLM.
  ingest-worker:
    build: .
    container_name: axel-ingest-worker
    restart: unless-stopped
    env_file: .env
    environment: &paper-worker-env
      DATABASE_URL: postgresql+psycopg://axel:${POSTGRES_PASSWORD:-axelpass}@timescaledb:5432/${POSTGRES_DB:-axel}
      ENVIRONMENT: paper
      ALPACA_PAPER: "true"
      LIVE_TRADING_CONFIRMED: "false"
      PAPER_RUNTIME_INTERVAL_SECONDS: ${PAPER_RUNTIME_INTERVAL_SECONDS:-5}
      PAPER_RUNTIME_SEED: ${PAPER_RUNTIME_SEED:-7}
      KILLSWITCH_STATE_FILE: /app/state/.axel_killswitch.json
      HALT_STATE_FILE: /app/state/.axel_halt.json
      LOG_FILE: ""
    command: ["python", "scripts/run_ingest_worker.py"]
    volumes:
      - axel_state:/app/state
    depends_on:
      migrate:
        condition: service_completed_successfully

  agent-worker:
    build: .
    container_name: axel-agent-worker
    restart: unless-stopped
    env_file: .env
    environment: *paper-worker-env
    command: ["python", "scripts/run_agent_worker.py"]
    volumes:
      - axel_state:/app/state
    depends_on:
      migrate:
        condition: service_completed_successfully

  core-worker:
    build: .
    container_name: axel-core-worker
    restart: unless-stopped
    env_file: .env
    environment: *paper-worker-env
    command: ["python", "scripts/run_core_worker.py"]
    volumes:
      - axel_state:/app/state
    depends_on:
      migrate:
        condition: service_completed_successfully

  # TLS termination and the only public entry point.
  caddy:
    image: caddy:2.8-alpine
    container_name: axel-caddy
    restart: unless-stopped
    environment:
      AXEL_SITE_ADDRESS: ${AXEL_SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  # ── Monitoring stack ──────────────────────────────────────────────────────
  # Read-only exporter. It snapshots durable state per scrape and never writes
  # to the database, submits an order, or changes risk state.
  axel-exporter:
    build: .
    container_name: axel-exporter
    restart: unless-stopped
    command: ["python", "scripts/run_metrics_exporter.py", "--host", "0.0.0.0", "--port", "9108"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://axel:${POSTGRES_PASSWORD:-axelpass}@timescaledb:5432/${POSTGRES_DB:-axel}
      ENVIRONMENT: paper
      ALPACA_PAPER: "true"
      LIVE_TRADING_CONFIRMED: "false"
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: "9108"
      KILLSWITCH_STATE_FILE: /app/state/.axel_killswitch.json
      HALT_STATE_FILE: /app/state/.axel_halt.json
      LOG_FILE: /var/log/axel/exporter.log
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-10000000}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-5}
    volumes:
      - axel_state:/app/state:ro
      - axel_logs:/var/log/axel
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AXEL_METRICS_PORT:-9108}:9108"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9108/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Alertmanager webhook -> PagerDuty / Telegram / generic webhook.
  axel-alert-relay:
    build: .
    container_name: axel-alert-relay
    restart: unless-stopped
    command: ["python", "scripts/run_alert_relay.py", "--host", "0.0.0.0", "--port", "9110"]
    env_file: .env
    environment:
      ALERT_RELAY_HOST: 0.0.0.0
      ALERT_RELAY_PORT: "9110"
      LOG_FILE: /var/log/axel/alert-relay.log
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-10000000}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-5}
    volumes:
      - axel_logs:/var/log/axel
    ports:
      - "127.0.0.1:${AXEL_ALERT_RELAY_PORT:-9110}:9110"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9110/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: axel-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${AXEL_PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - axel-exporter

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: axel-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:${AXEL_ALERTMANAGER_PORT:-9093}:9093"
    depends_on:
      - axel-alert-relay

  grafana:
    image: grafana/grafana:11.3.1
    container_name: axel-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-axel-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${AXEL_GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  timescaledb_data:
  redis_data:
  axel_state:
  axel_logs:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  caddy_data:
  caddy_config:
