version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: axel-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axelpass}
      POSTGRES_DB: ${POSTGRES_DB:-axel}
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-axel} -d ${POSTGRES_DB:-axel}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: axel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  paper-soak:
    build: .
    restart: unless-stopped
    profiles: ["paper"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://axel:${POSTGRES_PASSWORD:-axelpass}@timescaledb:5432/${POSTGRES_DB:-axel}
      ENVIRONMENT: paper
      ALPACA_PAPER: "true"
      LIVE_TRADING_CONFIRMED: "false"
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/axel-paper-soak-heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3

  dashboard:
    image: nginx:1.27-alpine
    restart: unless-stopped
    profiles: ["paper"]
    ports:
      - "${AXEL_DASHBOARD_PORT:-8080}:80"
    volumes:
      - ./axel/dashboard/ui:/usr/share/nginx/html:ro

volumes:
  timescaledb_data:
  redis_data:
