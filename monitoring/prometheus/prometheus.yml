global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: axel

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: axel
    metrics_path: /metrics
    static_configs:
      - targets: ["axel-exporter:9108"]
        labels:
          service: axel
          component: trading-core

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
