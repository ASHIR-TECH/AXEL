name: box keepalive

on:
  schedule:
    # Every 10 minutes. GitHub's scheduler is best-effort and can delay runs,
    # so each run holds the box open for ~9 minutes (see LOOP_SECONDS) to
    # absorb delays instead of relying on a single instant ping.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "How long this run should keep pinging the box"
        required: false
        default: "540"

permissions:
  contents: read

concurrency:
  group: box-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOOP_SECONDS: ${{ github.event.inputs.seconds || '540' }}
      PING_INTERVAL_SECONDS: "60"
    steps:
      - name: Hold the box awake
        env:
          BOX_TOKEN: ${{ secrets.BOX_TOKEN }}
          BOX_MCP_URL: https://mcp.box.simular.ai/mcp
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request

          token = os.environ.get("BOX_TOKEN", "").strip()
          if not token:
              print("BOX_TOKEN secret is not set; skipping this run")
              sys.exit(0)

          url = os.environ.get("BOX_MCP_URL", "https://mcp.box.simular.ai/mcp")
          protocol = "2025-06-18"
          loop_seconds = int(os.environ.get("LOOP_SECONDS", "540"))
          interval = max(10, int(os.environ.get("PING_INTERVAL_SECONDS", "60")))
          deadline = time.monotonic() + loop_seconds

          def ping() -> str:
              session = {"id": None}

              def headers_for() -> dict[str, str]:
                  headers = {
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "Accept": "application/json, text/event-stream",
                  }
                  if session["id"]:
                      headers["Mcp-Session-Id"] = str(session["id"])
                      headers["MCP-Protocol-Version"] = protocol
                  return headers

              def post(payload: dict) -> dict:
                  request = urllib.request.Request(
                      url,
                      data=json.dumps(payload).encode(),
                      headers=headers_for(),
                      method="POST",
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      sid = response.headers.get("mcp-session-id")
                      if sid:
                          session["id"] = sid
                      body = response.read().decode("utf-8", "replace")
                      ctype = response.headers.get("content-type", "")
                  if "text/event-stream" in ctype:
                      for line in body.splitlines():
                          if line.startswith("data:"):
                              data = json.loads(line[5:].strip())
                              if data.get("id") == payload.get("id"):
                                  return data
                      raise RuntimeError("no matching SSE response")
                  return json.loads(body)

              try:
                  init = post(
                      {
                          "jsonrpc": "2.0",
                          "id": 1,
                          "method": "initialize",
                          "params": {
                              "protocolVersion": protocol,
                              "capabilities": {},
                              "clientInfo": {"name": "axel-keepalive", "version": "2"},
                          },
                      }
                  )
                  if "error" in init:
                      raise RuntimeError(init["error"])

                  note = urllib.request.Request(
                      url,
                      data=json.dumps(
                          {"jsonrpc": "2.0", "method": "notifications/initialized"}
                      ).encode(),
                      headers=headers_for(),
                      method="POST",
                  )
                  urllib.request.urlopen(note, timeout=30).read()

                  result = post(
                      {
                          "jsonrpc": "2.0",
                          "id": 2,
                          "method": "tools/call",
                          "params": {
                              "name": "shell",
                              "arguments": {
                                  "command": "date -u +%FT%TZ",
                                  "timeout_s": 30,
                              },
                          },
                      }
                  )
                  if "error" in result:
                      raise RuntimeError(result["error"])
                  return "".join(
                      item.get("text", "")
                      for item in result.get("result", {}).get("content", [])
                      if item.get("type") == "text"
                  ).strip()
              finally:
                  if session["id"]:
                      try:
                          close = urllib.request.Request(
                              url, headers=headers_for(), method="DELETE"
                          )
                          urllib.request.urlopen(close, timeout=15).read()
                      except Exception:
                          pass

          ok = 0
          failures = 0
          while True:
              stamp = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
              try:
                  box_time = ping()
                  ok += 1
                  print(f"{stamp} box responded: {box_time}", flush=True)
              except Exception as exc:
                  failures += 1
                  print(f"{stamp} ping failed: {type(exc).__name__}: {exc}", flush=True)

              remaining = deadline - time.monotonic()
              if remaining <= interval:
                  break
              time.sleep(interval)

          print(f"summary: ok={ok} failed={failures} window_s={loop_seconds}")
          if ok == 0:
              sys.exit(1)
          PY
